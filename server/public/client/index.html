<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>PrintFlow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon {
      width: 56px; height: 56px;
      background: #1a73e8;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .logo h1 { font-size: 22px; font-weight: 700; color: #1a1a1a; }
    .logo p { font-size: 14px; color: #888; margin-top: 4px; }
    .drop-zone {
      border: 2px dashed #d0d0d0;
      border-radius: 14px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
      background: #fafafa;
    }
    .drop-zone.has-files { border-color: #1a73e8; background: #f0f6ff; }
    .drop-zone.dragover { border-color: #1a73e8; background: #e8f0fe; transform: scale(1.01); }
    .drop-icon { font-size: 40px; margin-bottom: 10px; }
    .drop-text { font-size: 15px; color: #555; font-weight: 500; }
    .drop-sub { font-size: 12px; color: #aaa; margin-top: 6px; }
    #fileInput { display: none; }
    .file-list { margin-bottom: 20px; }
    .file-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: #f5f5f7;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .file-item-icon { font-size: 20px; flex-shrink: 0; }
    .file-item-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1a1a1a; }
    .file-item-size { color: #aaa; font-size: 11px; flex-shrink: 0; }
    .file-item-remove { color: #ccc; cursor: pointer; font-size: 18px; flex-shrink: 0; line-height: 1; }
    .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }
    .field input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px; outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .field input:focus { border-color: #1a73e8; }
    .field { margin-bottom: 20px; }
    .btn {
      width: 100%; padding: 15px;
      background: #1a73e8; color: white;
      border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-family: inherit;
    }
    .btn:hover { background: #1557b0; }
    .btn:disabled { background: #b0c8f0; cursor: not-allowed; }
    .progress-wrap { margin-top: 16px; display: none; }
    .progress-bar-bg { background: #eee; border-radius: 99px; height: 8px; overflow: hidden; }
    .progress-bar-fill { background: #1a73e8; height: 100%; border-radius: 99px; transition: width 0.3s; width: 0%; }
    .progress-label { text-align: center; font-size: 13px; color: #888; margin-top: 8px; }
    .success { display: none; text-align: center; }
    .success-icon {
      width: 72px; height: 72px;
      background: #e8f5e9; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 36px; margin-bottom: 20px;
    }
    .job-id {
      font-size: 42px; font-weight: 800;
      letter-spacing: 6px; color: #1a73e8;
      background: #f0f6ff; border-radius: 14px;
      padding: 20px; margin-bottom: 20px;
    }
    .success-note {
      font-size: 14px; color: #555;
      background: #fffbe6; border-radius: 10px;
      padding: 14px; border: 1px solid #ffe082;
    }

    @media (max-width: 576px) {
      body { align-items: flex-start; padding-top: 40px; }
    }
  </style>
</head>
<body>
<div class="card">
  <div id="formView">
    <div class="logo">
      <div class="logo-icon">
        <svg width="28" height="28" fill="none" viewBox="0 0 24 24">
          <path d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v7H6v-7z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>PrintFlow</h1>
      <p>Envia tus archivos para imprimir</p>
    </div>

    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">📎</div>
      <div class="drop-text">Toca para elegir archivos</div>
      <div class="drop-sub">PDF, JPG, PNG, DOCX, XLSX - hasta 50MB</div>
    </div>
    <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.docx,.xlsx,.doc,.xls,.txt">

    <div class="file-list" id="fileList"></div>

    <div class="field">
      <label>Tu nombre <span style="color:#bbb;font-weight:400">(opcional)</span></label>
      <input type="text" id="clientName" placeholder="Ej: Juan Garcia">
    </div>

    <button class="btn" id="sendBtn" disabled>
      <svg width="18" height="18" fill="none" viewBox="0 0 24 24">
        <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Enviar archivos
    </button>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="progress-label" id="progressLabel">Subiendo...</div>
    </div>
  </div>

  <div class="success" id="successView">
    <div class="success-icon">✓</div>
    <p style="font-size:14px;color:#888;margin-bottom:24px">Tus archivos se enviaron correctamente</p>
    <div class="job-id" id="jobIdDisplay"></div>
    <div class="success-note">
      Decile al empleado este numero y en un momento te atendemos
    </div>
    <button class="btn" onclick="location.reload()" style="margin-top:16px">Volver</button>
  </div>
</div>

<script>
var selectedFiles = [];
var clientMac = null;

fetch("/api/mymac").then(function(r){ return r.json(); }).then(function(d){ clientMac = d.mac; }).catch(function(){});

var dropZone = document.getElementById("dropZone");
var fileInput = document.getElementById("fileInput");
var fileList = document.getElementById("fileList");
var sendBtn = document.getElementById("sendBtn");

dropZone.addEventListener("click", function(){ fileInput.click(); });

dropZone.addEventListener("dragover", function(e){
  e.preventDefault();
  dropZone.classList.add("dragover");
});
dropZone.addEventListener("dragleave", function(){ dropZone.classList.remove("dragover"); });
dropZone.addEventListener("drop", function(e){
  e.preventDefault();
  dropZone.classList.remove("dragover");
  addFiles(Array.from(e.dataTransfer.files));
});

fileInput.addEventListener("change", function(){
  addFiles(Array.from(fileInput.files));
  fileInput.value = "";
});

function addFiles(newFiles) {
  newFiles.forEach(function(f){
    if (!selectedFiles.find(function(x){ return x.name === f.name && x.size === f.size; })) {
      selectedFiles.push(f);
    }
  });
  renderFileList();
}

function renderFileList() {
  fileList.innerHTML = "";
  selectedFiles.forEach(function(f, i){
    var item = document.createElement("div");
    item.className = "file-item";
    item.innerHTML = "<span class=\"file-item-icon\">" + getFileIcon(f.name) + "</span>" +
      "<span class=\"file-item-name\">" + f.name + "</span>" +
      "<span class=\"file-item-size\">" + formatSize(f.size) + "</span>" +
      "<span class=\"file-item-remove\" data-i=\"" + i + "\">x</span>";
    fileList.appendChild(item);
  });
  fileList.querySelectorAll(".file-item-remove").forEach(function(btn){
    btn.addEventListener("click", function(){
      selectedFiles.splice(parseInt(btn.dataset.i), 1);
      renderFileList();
    });
  });
  dropZone.classList.toggle("has-files", selectedFiles.length > 0);
  sendBtn.disabled = selectedFiles.length === 0;
  dropZone.querySelector(".drop-text").textContent =
    selectedFiles.length > 0 ? "Toca para agregar mas" : "Toca para elegir archivos";
}

function getFileIcon(name) {
  var ext = name.split(".").pop().toLowerCase();
  var map = { pdf:"📄", jpg:"🖼️", jpeg:"🖼️", png:"🖼️", docx:"📝", doc:"📝", xlsx:"📊", xls:"📊", txt:"📃" };
  return map[ext] || "📎";
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1048576).toFixed(1) + " MB";
}

sendBtn.addEventListener("click", function(){
  if (selectedFiles.length === 0) return;
  var formData = new FormData();
  selectedFiles.forEach(function(f){ formData.append("files", f); });
  var name = document.getElementById("clientName").value.trim();
  formData.append("name", name || "Cliente");
  if (clientMac) formData.append("mac", clientMac);

  sendBtn.disabled = true;
  var progressWrap = document.getElementById("progressWrap");
  var progressFill = document.getElementById("progressFill");
  var progressLabel = document.getElementById("progressLabel");
  progressWrap.style.display = "block";

  var xhr = new XMLHttpRequest();
  xhr.open("POST", "/upload");

  xhr.upload.addEventListener("progress", function(e){
    if (e.lengthComputable) {
      var pct = Math.round((e.loaded / e.total) * 100);
      progressFill.style.width = pct + "%";
      progressLabel.textContent = "Subiendo... " + pct + "%";
    }
  });

  xhr.addEventListener("load", function(){
    try {
      var res = JSON.parse(xhr.responseText);
      if (res.success) {
        document.getElementById("formView").style.display = "none";
        var sv = document.getElementById("successView");
        sv.style.display = "block";
        document.getElementById("jobIdDisplay").textContent = res.jobId;
      } else {
        alert("Error al enviar. Intenta de nuevo.");
        sendBtn.disabled = false;
        progressWrap.style.display = "none";
      }
    } catch(e) {
      alert("Error al enviar. Intenta de nuevo.");
      sendBtn.disabled = false;
      progressWrap.style.display = "none";
    }
  });

  xhr.addEventListener("error", function(){
    alert("Error de conexion. Verifica que estes conectado a PrintFlow.");
    sendBtn.disabled = false;
    progressWrap.style.display = "none";
  });

  xhr.send(formData);
});
</script>
</body>
</html>
