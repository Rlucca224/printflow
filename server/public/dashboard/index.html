<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>uPrint - Panel</title>
  <style>
    /* ============================================
       VARIABLES DE TEMA
       ============================================ */
    :root {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #666;
      --border: #e0e0e0;
      --file-row-bg: #f0f0f2;
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --success: #34a853;
      --success-light: #e8f5e9;
      --warning: #e65100;
      --warning-light: #fff3e0;
      --info-light: #e8f0fe;
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 12px;
      --radius-xl: 16px;
    }

    [data-theme="dark"] {
      --bg: #1a1a1a;
      --card-bg: #2a2a2a;
      --text: #e0e0e0;
      --text-secondary: #999;
      --border: #333;
      --file-row-bg: #333;
      --primary: #8ab4f8;
      --primary-hover: #aecbfa;
      --success: #81c784;
      --success-light: #1b3a1b;
      --warning: #ffab40;
      --warning-light: #3e2723;
      --info-light: #0d2b4d;
    }

    /* ============================================
       RESET Y BASE
       ============================================ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
    }

    /* ============================================
       LAYOUT PRINCIPAL
       ============================================ */
    .app {
      display: flex;
      min-height: 100vh;
    }

    .main {
      flex: 1;
      padding: 20px 32px 32px;
      overflow: auto;
    }

    .main header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      row-gap: 10px;
      column-gap: 16px;
      padding: 4px 0 16px;
      margin-bottom: 20px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex: 1 1 auto;
      min-width: 0;
    }

    /* ============================================
       BRAND / LOGO
       ============================================ */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: var(--primary);
      color: #ffffff;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    [data-theme="dark"] .brand-icon {
      background: #ffffff;
      color: #000000;
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .brand p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ============================================
       SIDEBAR
       ============================================ */
    .sidebar {
      width: 240px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
    }

    .sidebar .brand {
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .sidebar .brand-icon {
      margin-bottom: 12px;
    }

    .sidebar .brand h1 {
      font-size: 18px;
      margin: 0;
    }

    .sidebar .brand p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .nav-item {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      background: transparent;
      color: var(--text-secondary);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2px;
    }

    .nav-item:hover {
      background: var(--file-row-bg);
      color: var(--text);
    }

    .nav-item.active {
      background: var(--info-light);
      color: var(--primary);
    }

    .nav-icon {
      width: 18px;
      height: 18px;
    }

    /* ============================================
       HEADER / ESTADO
       ============================================ */
    .status-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .conn-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
    }

    .dot.on {
      background: var(--success);
    }

    .pending-badge {
      color: var(--warning);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
    }

    .pending-badge.zero {
      color: var(--success);
    }

    /* ============================================
       TOGGLE DE TEMA
       ============================================ */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      display: inline-flex;
      background: var(--file-row-bg);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }

    .theme-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .theme-btn.active {
      background: var(--card-bg);
      color: var(--text);
    }

    .theme-btn:not(.active):hover {
      color: var(--text);
    }

    .theme-btn svg {
      width: 15px;
      height: 15px;
    }

    /* ============================================
       PANELES / TABS
       ============================================ */
    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .empty {
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      padding: 40px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* ============================================
       TARJETAS DE TRABAJOS
       ============================================ */
    .job-card {
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      padding: 18px 20px;
      margin-bottom: 12px;
      transition: box-shadow 0.3s;
    }

    .job-card.done {
      opacity: 0.6;
    }

    .job-card.flash {
      box-shadow: 0 0 0 3px var(--primary);
    }

    .job-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .job-id {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text);
    }

    .job-meta {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .job-meta span {
      color: var(--text);
      font-weight: 600;
    }

    .badge {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 99px;
      white-space: nowrap;
    }

    .badge.pending {
      background: var(--warning-light);
      color: var(--warning);
    }

    .badge.done {
      background: var(--success-light);
      color: var(--success);
    }

    /* ============================================
       LISTA DE ARCHIVOS
       ============================================ */
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .file-list-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--file-row-bg);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      font-size: 13px;
    }

    .file-row .icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .file-row .name {
      flex: 1;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-row .size {
      color: var(--text-secondary);
      font-size: 11px;
      flex-shrink: 0;
    }

    .file-row a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
      flex-shrink: 0;
    }

    .file-row a:hover {
      text-decoration: underline;
    }

    /* ============================================
       BOTONES
       ============================================ */
    .btn {
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      background: var(--primary);
      color: #fff;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-done-label {
      color: var(--success);
      font-size: 13px;
      font-weight: 500;
    }

    .btn-downlink {
      display: inline-block;
      padding: 8px 16px;
      border-radius: var(--radius-lg);
      background: var(--info-light);
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-downlink:hover {
      background: #d2e3fc;
    }

    [data-theme="dark"] .btn-downlink:hover {
      background: #3a4a5c;
    }

    /* ============================================
       PANEL QR
       ============================================ */
    .qr-container {
      display: flex;
      gap: 24px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .qr-panel {
      text-align: center;
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }

    .qr-panel img {
      display: block;
      margin: 0 auto 24px;
      border-radius: var(--radius-lg);
    }

    .qr-panel-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .qr-panel-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .qr-link-url {
      font-size: 13px;
      color: var(--text-secondary);
      word-break: break-all;
      background: var(--file-row-bg);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
    }

    .qr-field {
      margin-bottom: 16px;
      text-align: left;
    }

    .qr-field label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .qr-field input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      background: var(--file-row-bg);
      color: var(--text);
      outline: none;
    }

    .qr-field input:focus {
      border-color: var(--primary);
    }

    [data-theme="dark"] .qr-field input {
      border-color: #555;
    }

    .qr-input-wrap {
      position: relative;
    }

    .qr-input-wrap input {
      padding-right: 40px;
    }

    .qr-toggle-pass {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-toggle-pass:hover {
      background: var(--file-row-bg);
      color: var(--text);
    }

    .qr-toggle-pass svg {
      width: 18px;
      height: 18px;
    }

    .qr-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .qr-actions .btn-gen {
      flex: 1;
      padding: 10px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      background: var(--primary);
      color: #fff;
    }

    .qr-actions .btn-gen:hover {
      background: var(--primary-hover);
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 992px) {
      .main {
        padding: 16px 20px 20px;
      }

      .main header {
        padding: 16px 0;
      }
    }

    @media (max-width: 768px) {
      .app {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        padding: 12px 16px;
      }

      .sidebar .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 0;
      }

      .sidebar .brand-icon {
        width: 38px;
        height: 38px;
        margin-bottom: 0;
      }

      .nav-item {
        width: auto;
      }

      .status-row {
        width: 100%;
        justify-content: flex-end;
      }
    }

    @media (max-width: 576px) {
      body {
        padding: 0;
      }

      .theme-toggle {
        top: 12px;
        right: 12px;
      }

      .main {
        padding: 12px;
      }

      .sidebar .brand h1 {
        font-size: 17px;
      }

      .sidebar .brand p {
        display: none;
      }

      .job-card {
        padding: 14px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .file-row {
        flex-wrap: wrap;
      }

      .brand h1 {
        font-size: 18px;
      }
    }

    /* ============================================
       DARK THEME MONOCHROME OVERRIDES
       ============================================ */
    [data-theme="dark"] .btn {
      background: #ffffff;
      color: #000000;
    }

    [data-theme="dark"] .btn:hover {
      background: #e0e0e0;
    }

    [data-theme="dark"] .nav-item.active {
      background: #333;
      color: #fff;
    }

    [data-theme="dark"] .pending-badge.zero {
      color: #ffffff;
    }

    [data-theme="dark"] .qr-actions .btn-gen {
      background: #ffffff;
      color: #000000;
    }

    [data-theme="dark"] .qr-actions .btn-gen:hover {
      background: #e0e0e0;
    }
  </style>
  <script>
  (function() {
    var stored = localStorage.getItem("printflow-theme") || "system";
    var theme = stored === "system"
      ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      : stored;
    document.documentElement.setAttribute("data-theme", theme);
  })();
  </script>
</head>
<body>

  <button class="theme-btn" data-theme-value="system" title="Sistema">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
  </button>
  <button class="theme-btn" data-theme-value="light" title="Claro">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>

  <button class="theme-btn" data-theme-value="dark" title="Oscuro">

  </button>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">
        <svg width="24" height="24" fill="none" viewBox="0 0 24 24">
          <path d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v7H6v-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1>uPrint</h1>
        <p>Panel de trabajos</p>
      </div>
    </div>
    <button class="nav-item active" data-tab="queue">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>

    </button>

  <main class="main">

    <div class="tab-panel" id="panel-qr">

          <div class="qr-panel-title">QR Wi-Fi</div>

              </button>

          </div>
          <div class="qr-field">
            <label>Nueva contraseña</label>
            <div class="qr-input-wrap">
              <input type="password" id="qrNewPass" placeholder="Dejar vacío si es red abierta">
              <button class="qr-toggle-pass" type="button" data-target="qrNewPass" aria-label="Mostrar contraseña">
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-closed" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.88 9.88 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <div class="qr-actions">
            <button class="btn-gen" id="qrGenerate">Generar QR</button>
          </div>
        </div>

        <div class="qr-panel">
          <div class="qr-panel-title">QR para clientes</div>
          <div class="qr-panel-sub">Escaneá para abrir la página de carga</div>
          <img id="qrLinkImage" src="/api/qr?text=http%3A%2F%2Flocalhost%3A3000%2F" alt="QR página de carga">
          <div class="qr-link-url" id="qrLinkUrl">http://localhost:3000/</div>
        </div>
      </div>
    </div>
  </main>
</div>

<audio id="notifSound" preload="auto"></audio>

<script>
(function() {
  var toggle = document.getElementById("themeToggle");
  var buttons = toggle.querySelectorAll(".theme-btn");
  var stored = localStorage.getItem("printflow-theme") || "system";

  function setActive(value) {
    buttons.forEach(function(btn) {
      btn.classList.toggle("active", btn.dataset.themeValue === value);
    });
  }

  function applyTheme(v) {
    if (v === "system") {
      var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    } else {
      document.documentElement.setAttribute("data-theme", v);
    }
  }

  setActive(stored);
  applyTheme(stored);

  buttons.forEach(function(btn) {
    btn.addEventListener("click", function() {
      var value = btn.dataset.themeValue;
      localStorage.setItem("printflow-theme", value);
      setActive(value);
      applyTheme(value);
    });
  });
})();

(function() {
  var tabs = document.querySelectorAll(".nav-item");
  var queueHeader = document.getElementById("queueHeader");
  tabs.forEach(function(btn) {
    btn.addEventListener("click", function() {
      tabs.forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");
      document.querySelectorAll(".tab-panel").forEach(function(p) { p.classList.remove("active"); });
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      if (queueHeader) {
        queueHeader.style.display = btn.dataset.tab === "queue" ? "block" : "none";
      }
    });
  });

  var activeTab = document.querySelector(".nav-item.active");
  if (queueHeader && activeTab) {
    queueHeader.style.display = activeTab.dataset.tab === "queue" ? "block" : "none";
  }

  fetch("/api/config")
    .then(function(r) { return r.json(); })
    .then(function(cfg) {
      var ssidInput = document.getElementById("qrSsid");
      var currentPass = document.getElementById("qrCurrentPass");
      var qrImage = document.getElementById("qrImage");
      if (cfg.ssid !== undefined && ssidInput) ssidInput.value = cfg.ssid;
      if (cfg.pass !== undefined && currentPass) currentPass.value = cfg.pass;
      if (qrImage) {
        qrImage.src = "/api/qr?ssid=" + encodeURIComponent(cfg.ssid || "uPrint") + "&pass=" + encodeURIComponent(cfg.pass || "");
      }
    })
    .catch(function() {});

  document.getElementById("qrGenerate").addEventListener("click", function() {
    var ssid = document.getElementById("qrSsid").value || "uPrint";
    var pass = document.getElementById("qrNewPass").value;
    document.getElementById("qrImage").src = "/api/qr?ssid=" + encodeURIComponent(ssid) + "&pass=" + encodeURIComponent(pass);
    document.getElementById("qrCurrentPass").value = pass;
    document.getElementById("qrNewPass").value = "";
  });

  document.querySelectorAll(".qr-toggle-pass").forEach(function(btn) {
    btn.addEventListener("click", function() {
      var input = document.getElementById(btn.dataset.target);
      var openIcon = btn.querySelector(".eye-open");
      var closedIcon = btn.querySelector(".eye-closed");
      if (input.type === "password") {
        input.type = "text";
        openIcon.style.display = "none";
        closedIcon.style.display = "block";
        btn.setAttribute("aria-label", "Ocultar contraseña");
      } else {
        input.type = "password";
        openIcon.style.display = "block";
        closedIcon.style.display = "none";
        btn.setAttribute("aria-label", "Mostrar contraseña");
      }
    });
  });

  var qrLinkImage = document.getElementById("qrLinkImage");
  var qrLinkUrl = document.getElementById("qrLinkUrl");
  var uploadUrl = window.location.protocol + "//" + window.location.host + "/";
  qrLinkImage.src = "/api/qr?text=" + encodeURIComponent(uploadUrl);
  qrLinkUrl.textContent = uploadUrl;
})();

var jobs = {};
var activeSection = document.getElementById("activeSection");
var emptyState = document.getElementById("emptyState");
var pendingBadge = document.getElementById("pendingBadge");
var connDot = document.getElementById("connDot");
var connLabel = document.getElementById("connLabel");

var socket = io();

socket.on("connect", function() {
  connDot.classList.add("on");
  connLabel.textContent = "Conectado";
});
socket.on("disconnect", function() {
  connDot.classList.remove("on");
  connLabel.textContent = "Desconectado";
});

socket.on("queue_init", function(queue) {
  jobs = {};
  queue.forEach(function(j) { jobs[j.id] = j; });
  render();
});

socket.on("new_job", function(job) {
  jobs[job.id] = job;
  render();
  playBeep();
  flashCard(job.id);
});

socket.on("job_updated", function(job) {
  jobs[job.id] = job;
  render();
});

function render() {
  var all = Object.keys(jobs).map(function(k) { return jobs[k]; });
  all.sort(function(a, b) { return new Date(b.timestamp) - new Date(a.timestamp); });

  var active = all.filter(function(j) { return j.status !== "done"; });

  emptyState.style.display = active.length === 0 ? "block" : "none";
  activeSection.innerHTML = "";
  if (active.length === 0) activeSection.appendChild(emptyState);
  active.forEach(function(j) { activeSection.appendChild(buildCard(j)); });

  var pendingCount = all.filter(function(j) { return j.status === "pending"; }).length;
  pendingBadge.textContent = pendingCount + (pendingCount === 1 ? " pendiente" : " pendientes");
  pendingBadge.classList.toggle("zero", pendingCount === 0);
}

function buildCard(job) {
  var card = document.createElement("div");
  card.className = "job-card " + job.status;
  card.id = "card-" + job.id;

  var statusLabel = { pending: "Pendiente", done: "Listo" }[job.status] || job.status;
  var time = formatTime(job.timestamp);

  var filesHtml = job.files.map(function(f) {
    return '<div class="file-row">' +
      '<span class="icon">' + getFileIcon(f.originalName) + '</span>' +
      '<span class="name">' + escapeHtml(f.originalName) + '</span>' +
      '<span class="size">' + formatSize(f.size) + '</span>' +
      '<a href="/uploads/' + f.savedName + '" target="_blank">Ver / Imprimir</a>' +
      '</div>';
  }).join("");

  var actionsHtml = "";
  if (job.status !== "done") {
    actionsHtml = '<button class="btn" data-action="done" data-id="' + job.id + '">Marcar listo</button>';
  } else {
    actionsHtml = '<span class="btn-done-label">&#10003; Entregado</span>';
  }

  card.innerHTML =
    '<div class="job-top">' +
      '<div>' +
        '<div class="job-id">' + job.id + '</div>' +
        '<div class="job-meta"><span>' + escapeHtml(job.clientName) + '</span> &middot; ' + time + '</div>' +
      '</div>' +
      '<div class="badge ' + job.status + '">' + statusLabel + '</div>' +
    '</div>' +
    '<div class="file-list">' + filesHtml + '</div>' +
    (job.files.length > 1 ? '<div class="file-list-actions"><a class="btn-downlink" href="/api/job/' + job.id + '/download">Descargar todo</a></div>' : '') +
    '<div class="actions">' + actionsHtml + '</div>';

  card.querySelectorAll("[data-action]").forEach(function(btn) {
    btn.addEventListener("click", function() {
      updateStatus(btn.dataset.id, btn.dataset.action);
    });
  });

  return card;
}

function updateStatus(id, status) {
  fetch("/api/job/" + id + "/status", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: status })
  });
}

function flashCard(id) {
  setTimeout(function() {
    var el = document.getElementById("card-" + id);
    if (!el) return;
    el.classList.add("flash");
    setTimeout(function() { el.classList.remove("flash"); }, 1500);
  }, 50);
}

function getFileIcon(name) {
  var ext = name.split(".").pop().toLowerCase();
  var map = { pdf: "\ud83d\udcc4", jpg: "\ud83d\uddbc\ufe0f", jpeg: "\ud83d\uddbc\ufe0f", png: "\ud83d\uddbc\ufe0f", docx: "\ud83d\udcdd", doc: "\ud83d\udcdd", xlsx: "\ud83d\udcca", xls: "\ud83d\udcca", txt: "\ud83d\udcc3" };
  return map[ext] || "\ud83d\udcce";
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1048576).toFixed(1) + " MB";
}

function formatTime(iso) {
  var d = new Date(iso);
  return d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
}

function escapeHtml(str) {
  var div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function playBeep() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  } catch (e) {}
}
</script>
